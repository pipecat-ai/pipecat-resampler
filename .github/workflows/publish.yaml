name: publish

on:
  workflow_dispatch:
    inputs:
      gitref:
        type: string
        description: 'what git tag to build (e.g. v0.1.0)'
        required: true

jobs:
  check-version:
    name: 'Check the version and its changelog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.gitref }}

      - name: Compare the tag with pyproject.toml
        env:
          GITREF: ${{ github.event.inputs.gitref }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITREF#v}" != "$version" ]; then
            echo "Tag $GITREF doesn't match version $version in pyproject.toml"
            exit 1
          fi

      # The release notes come from this section, so a version without one
      # stops here, before anything is published.
      - name: Check CHANGELOG.md has a section for the version
        env:
          GITREF: ${{ github.event.inputs.gitref }}
        run: python3 scripts/release-changelog.py "${GITREF#v}" > /dev/null

  build:
    name: 'Build and test wheels'
    needs: [check-version]
    uses: ./.github/workflows/wheels.yaml
    with:
      gitref: ${{ github.event.inputs.gitref }}

  publish-to-pypi:
    name: 'Publish to PyPI'
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-resampler
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          print-hash: true

  # Runs once the package is installable from PyPI. The notes are the
  # version's CHANGELOG.md section, unwrapped for GitHub by
  # scripts/release-changelog.py.
  github-release:
    name: 'Create GitHub Release'
    runs-on: ubuntu-latest
    needs: [publish-to-pypi]
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.gitref }}

      - name: Generate release notes
        env:
          GITREF: ${{ github.event.inputs.gitref }}
        run: python3 scripts/release-changelog.py --no-heading "${GITREF#v}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITREF: ${{ github.event.inputs.gitref }}
        run: |
          if gh release view "$GITREF" >/dev/null 2>&1; then
            gh release edit "$GITREF" --notes-file release-notes.md
          else
            gh release create "$GITREF" --title "$GITREF" --notes-file release-notes.md --verify-tag
          fi
